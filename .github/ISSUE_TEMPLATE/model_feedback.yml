name: Model compatibility feedback
description: Tell us how the beta behaves on another Navimow model
title: "[Model test]: "
labels: ["compatibility"]
body:
  - type: input
    id: model
    attributes:
      label: Navimow model
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: Features tested
      options:
        - label: Login/setup
        - label: Entities/telemetry
        - label: LiDAR map
        - label: Live mower position
        - label: Zone selection/mowing
        - label: Trail
        - label: Work mode/cutting height
        - label: Schedule
        - label: Weather delay handling
  - type: textarea
    id: notes
    attributes:
      label: Results / differences from the official app
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, tokens, serial numbers or precise GPS coordinates.
          required: true
